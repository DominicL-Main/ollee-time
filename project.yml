name: OlleeTime

options:
  bundleIdPrefix: com.dominiclm
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  OlleeTime:
    type: application
    platform: iOS
    sources:
      - path: OlleeTime
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Ollee Time
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Ollee Time uses Bluetooth to send the clock time to your Ollee watch.
        NSLocationWhenInUseUsageDescription: Ollee Time includes your approximate location when setting the clock so the watch's sunrise and sunset face stays correct.
        NSMicrophoneUsageDescription: Ollee Time listens to the time you say out loud so the watch clock can be set by voice.
        NSSpeechRecognitionUsageDescription: Ollee Time turns your spoken time into an hour and minute. Speech is transcribed on the device and nothing is stored.
        UIBackgroundModes:
          - audio
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominiclm.olleetime
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  OlleeTime:
    build:
      targets:
        OlleeTime: all
    run:
      config: Debug
    archive:
      config: Release
